name: Deploy score site to Pages

on:
  push:
    branches: [main, master]
    paths:
      - "score.txt"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site assets
        run: |
          cp score.txt site/score.txt
          cp "친쏘골 엠블렘.png" "site/친쏘골 엠블렘.png"
          VERSION="${GITHUB_SHA::7}"
          perl -0pi -e "s/__BUILD_VERSION__/${VERSION}/g" site/*.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
