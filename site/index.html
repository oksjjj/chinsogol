<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>친소골 스코어 보드</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="home">
    <main class="container">
      <header class="site-header">
        <div class="logo-mark" aria-hidden="true">친쏘골</div>
        <div>
          <h1>친쏘골 스코어 보드</h1>
          <p class="subtitle">대회별/개인별 스코어를 한눈에 확인하세요.</p>
        </div>
      </header>

      <section class="panel">
        <h2>대회별 조회</h2>
        <input id="contestSearch" class="search" placeholder="대회명 검색 (예: 26년7월)" />
        <ul id="contestList" class="link-list"></ul>
      </section>

      <section class="panel">
        <h2>개인별 조회</h2>
        <input id="personSearch" class="search" placeholder="이름 검색 (예: 김성진)" />
        <ul id="personList" class="link-list"></ul>
      </section>

      <footer class="site-footer">
        <a
          class="footer-link"
          href="https://app.notion.com/p/31b148cd77bb80068014fed30d5d1f27?pvs=11"
          target="_blank"
          rel="noreferrer"
        >
          친쏘골 노션 바로가기
        </a>
      </footer>
    </main>

    <script type="module" src="app.js"></script>
  </body>
  </html>
