<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>개인별 스코어 조회</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="person">
    <main class="container">
      <header class="site-header compact">
        <div class="brand-mark">
          <img
            class="brand-emblem"
            src="친쏘골 엠블렘.png"
            alt="친쏘골 엠블렘"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
          />
          <div class="logo-mark" aria-hidden="true" style="display: none;">친쏘골</div>
        </div>
        <div>
          <h1>개인별 스코어 조회</h1>
          <p class="subtitle">개인 기록 추이와 세부 스코어를 확인하세요.</p>
        </div>
      </header>

      <nav class="top-tabs" aria-label="페이지 이동">
        <a class="tab-link" href="index.html">홈</a>
        <a class="tab-link" href="contest.html">대회별</a>
        <a class="tab-link active" href="person.html">개인별</a>
      </nav>

      <section class="panel">
        <label for="personSelect">이름 선택</label>
        <select id="personSelect"></select>
      </section>

      <section class="panel">
        <h2 id="personTitle">대회별 차트</h2>
        <div id="personContestChart"></div>
      </section>

      <section class="panel">
        <h2>세부 스코어</h2>
        <table>
          <thead>
            <tr>
              <th>대회</th>
              <th>코스</th>
              <th>스트로크</th>
            </tr>
          </thead>
          <tbody id="personTableBody"></tbody>
        </table>
      </section>

      <footer class="site-footer">
        <a
          class="footer-link"
          href="https://app.notion.com/p/31b148cd77bb80068014fed30d5d1f27?pvs=11"
          target="_blank"
          rel="noreferrer"
        >
          친쏘골 노션 바로가기
        </a>
      </footer>
    </main>

    <script type="module" src="app.js"></script>
  </body>
  </html>
