<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="build-version" content="__BUILD_VERSION__" />
    <title>대회별 스코어 조회</title>
    <link rel="stylesheet" href="style.css?v=__BUILD_VERSION__" />
  </head>
  <body data-page="contest">
    <main class="container">
      <header class="site-header">
        <div class="brand-mark">
          <img
            class="brand-emblem"
            src="친쏘골 엠블렘.png?v=__BUILD_VERSION__"
            alt="친쏘골 엠블렘"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
          />
          <div class="logo-mark" aria-hidden="true" style="display: none;">친쏘골</div>
        </div>
        <div>
          <h1>대회별 스코어 조회</h1>
          <p class="subtitle">참가자 순위와 대회 결과를 확인하세요.</p>
        </div>
      </header>

      <nav class="top-tabs" aria-label="페이지 이동">
        <a class="tab-link" href="index.html">홈</a>
        <a class="tab-link active" href="contest.html">대회별</a>
        <a class="tab-link" href="person.html">개인별</a>
      </nav>

      <section id="contestBrowse" class="panel list-panel">
        <h2>대회 목록</h2>
        <ul id="contestList" class="link-list"></ul>
      </section>

      <div id="contestDetail" hidden>
        <section class="panel">
          <div class="detail-toolbar">
            <a class="text-link" href="contest.html">← 전체 목록</a>
          </div>
          <label for="contestSelect">대회 선택</label>
          <select id="contestSelect"></select>
        </section>

        <section class="panel">
          <h2 id="contestTitle">스코어</h2>
          <p id="contestCourse" class="muted"></p>
          <table class="score-table">
            <thead>
              <tr>
                <th>순위</th>
                <th>이름</th>
                <th class="score-col">스코어</th>
              </tr>
            </thead>
            <tbody id="contestTableBody"></tbody>
          </table>
        </section>
      </div>

      <footer class="site-footer">
        <a
          class="footer-link"
          href="https://app.notion.com/p/31b148cd77bb80068014fed30d5d1f27?pvs=11"
          target="_blank"
          rel="noreferrer"
        >
          친쏘골 노션 바로가기
        </a>
      </footer>
    </main>

    <script type="module" src="app.js?v=__BUILD_VERSION__"></script>
  </body>
</html>
